<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-S3 Infer</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1d2330; --mute:#667085; --line:#d9dde3; --acc:#1f6feb; --media:#e9ecf0; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:1440px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width: 1000px) { main { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  h1 { font-size:18px; margin:0 0 4px; grid-column:1/-1; }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; display:flex; flex-direction:column; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin:0 0 10px; }
  /* 3 khung anh cung ti le 4:3 -> 3 cot thang hang */
  .media { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:var(--media); border-radius:6px; }
  .media-box { position:relative; }
  #camBox { aspect-ratio:4/3; background:var(--media); border-radius:6px; }   /* giu cho 4:3 ca khi chua co hinh */
  #camBox > .media { position:absolute; inset:0; height:100%; }
  .media-box > .hint { position:absolute; inset:0; display:grid; place-items:center; color:var(--mute); font-size:13px; pointer-events:none; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; }
  input[type=text] { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { padding:9px 18px; border:0; border-radius:6px; background:var(--acc); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:13px; color:var(--mute); margin-top:8px; min-height:1.4em; }
  .err { color:#c62828 !important; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0; }
  .kv b { font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
  th { color:var(--mute); font-weight:500; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>ESP32-S3 · Detection + Intent</h1>

  <section>
    <h2>Ảnh gốc</h2>
    <div class="media-box">
      <canvas id="orig" class="media" role="img" aria-label="Ảnh gốc"></canvas>
      <div class="hint" id="origHint">Chưa có ảnh</div>
    </div>
    <label for="file">Tải ảnh lên</label>
    <input id="file" type="file" accept="image/*">
    <label for="q">Câu hỏi</label>
    <input id="q" type="text" placeholder="VD: Có bao nhiêu cái cốc trong ảnh?">
    <div class="row"><button id="run" disabled>Run</button></div>
    <div class="msg" id="status" role="status"></div>
  </section>

  <section>
    <h2>Camera</h2>
    <div class="media-box" id="camBox">
      <div class="hint" id="camHint">Chưa có hình</div>
    </div>
    <div class="row">
      <button id="camOn">Stream</button>
      <button id="camOff" class="ghost">Stop</button>
      <button id="camShot" class="ghost" disabled>Chụp ảnh</button>
    </div>
    <div class="msg" id="camMsg" role="status"></div>
  </section>

  <section>
    <h2>Kết quả</h2>
    <div class="media-box">
      <canvas id="cv" class="media" role="img" aria-label="Ảnh kết quả có bounding box"></canvas>
      <div class="hint" id="cvHint">Chưa chạy</div>
    </div>
    <div class="kv">
      <span>Intent</span><b id="intent">–</b>
      <span>Trả lời</span><b id="answer">–</b>
      <span>Thời gian</span><span id="time">–</span>
    </div>
    <table>
      <thead><tr><th>#</th><th>Đối tượng</th><th>Score</th></tr></thead>
      <tbody id="list"><tr><td colspan="3">Chưa chạy</td></tr></tbody>
    </table>
  </section>
</main>
<script>
const W = 320, H = 240;
const COLORS = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#42d4f4','#f032e6'];
const NAMES = ['bottle','cup','phone','book','mouse','box','toy_car'];
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let img = null;   // Image hoac canvas (anh chup tu camera)

function resetResult() {
  ctx.clearRect(0, 0, cv.width, cv.height); $('cvHint').hidden = false;
  $('intent').textContent = $('answer').textContent = $('time').textContent = '–';
  $('list').innerHTML = '<tr><td colspan="3">Chưa chạy</td></tr>';
}

function setImage(src, note) {   // dua anh vao khung Anh goc (tu file hoac tu camera)
  img = src;
  const o = $('orig');
  o.width = cv.width = Math.min(960, src.width); o.height = cv.height = Math.round(o.width * src.height / src.width);
  o.getContext('2d').drawImage(src, 0, 0, o.width, o.height);
  $('origHint').hidden = true;
  resetResult();
  $('run').disabled = false; $('status').className = 'msg'; $('status').textContent = note;
}

function draw(dets) {   // ve len anh ket qua rieng, anh goc giu nguyen
  $('cvHint').hidden = true;
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.lineWidth = 3; ctx.font = 'bold 16px system-ui';
  for (const d of dets || []) {
    const col = COLORS[NAMES.indexOf(d.c) % COLORS.length];
    const [x1, y1, x2, y2] = [d.b[0]*cv.width, d.b[1]*cv.height, d.b[2]*cv.width, d.b[3]*cv.height];
    ctx.strokeStyle = ctx.fillStyle = col;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    const t = `${d.c} ${(d.s*100).toFixed(0)}%`, tw = ctx.measureText(t).width + 8;
    ctx.fillRect(x1, Math.max(0, y1 - 20), tw, 20);
    ctx.fillStyle = '#fff'; ctx.fillText(t, x1 + 4, Math.max(15, y1 - 5));
  }
}

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => setImage(im, `Ảnh tải lên ${im.width}×${im.height}`);
  im.src = URL.createObjectURL(f);
};

// Camera OV7670 live (MJPEG cong 81, co header CORS -> chup frame vao canvas duoc)
const cam = new Image();
cam.className = 'media'; cam.alt = 'Camera OV7670'; cam.crossOrigin = 'anonymous'; cam.hidden = true;
$('camBox').prepend(cam);
const camMsg = (t, err) => { $('camMsg').className = err ? 'msg err' : 'msg'; $('camMsg').textContent = t; };
cam.onload = () => {
  $('camHint').hidden = true; $('camShot').disabled = false;
  camMsg('Camera live · QVGA 320×240');
};
cam.onerror = () => {
  cam.hidden = true; $('camHint').hidden = false; $('camShot').disabled = true;
  camMsg('Không có camera (hoặc camera lỗi).', true);
};
$('camOn').onclick = () => {
  cam.hidden = false; camMsg('Đang kết nối camera...');
  cam.src = `http://${location.hostname}:81/stream?${Date.now()}`;
};
$('camOff').onclick = () => {
  cam.removeAttribute('src'); cam.hidden = true; $('camHint').hidden = false; $('camShot').disabled = true;
  camMsg('Đã dừng.');
};
$('camShot').onclick = () => {   // chi chup frame dang hien va luu file, khong dua vao model
  const c = document.createElement('canvas');
  c.width = cam.naturalWidth || W; c.height = cam.naturalHeight || H;
  c.getContext('2d').drawImage(cam, 0, 0, c.width, c.height);
  c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = `camera_${new Date().toISOString().replace(/[:.]/g, '-')}.jpg`;
    a.click(); URL.revokeObjectURL(a.href);
    camMsg(`Đã chụp ${c.width}×${c.height}: ${a.download}`);
  }, 'image/jpeg', 0.92);
};
$('camOn').onclick();

$('run').onclick = async () => {
  $('run').disabled = true; $('status').className = 'msg'; $('status').textContent = 'Đang chạy...';
  try {
    // resize kieu stretch ve 320x240 giong cv2.resize trong notebook
    const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
    const octx = oc.getContext('2d'); octx.drawImage(img, 0, 0, W, H);
    const rgba = octx.getImageData(0, 0, W, H).data, rgb = new Uint8Array(W * H * 3);
    for (let i = 0, j = 0; i < rgba.length; i += 4) { rgb[j++] = rgba[i]; rgb[j++] = rgba[i+1]; rgb[j++] = rgba[i+2]; }
    // vocab TextCNN la tieng Viet khong dau
    const q = $('q').value.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D')
      .replace(/[^\x20-\x7e]/g, ' ').slice(0, 500);
    const body = new Uint8Array(rgb.length + q.length); body.set(rgb); body.set(new TextEncoder().encode(q), rgb.length);

    const r = await fetch('/run', { method: 'POST', body });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();
    draw(j.dets);
    $('intent').textContent = j.intent || '–';
    $('answer').textContent = j.answer || '–';
    $('time').textContent = `detect ${j.ms_det} ms · intent ${j.ms_intent} ms`;
    $('list').innerHTML = j.dets.length ? '' : '<tr><td colspan="3">Không phát hiện đối tượng</td></tr>';
    j.dets.forEach((d, i) => {
      const tr = $('list').insertRow();
      tr.insertCell().textContent = i + 1; tr.insertCell().textContent = d.c; tr.insertCell().textContent = d.s.toFixed(3);
    });
    $('status').textContent = '';
  } catch (e) {
    $('status').className = 'msg err'; $('status').textContent = 'Lỗi: ' + e.message;
  }
  $('run').disabled = false;
};
</script>
</body>
</html>
